# Chi puo' usare quale comando.
#
# Valori ammessi:
#   everyone            tutti i membri del server
#   Admin, Moderator    uno o piu' NOMI di ruolo, separati da virgola
#   1537120244122783845 uno o piu' ID ruolo (funzionano ancora)
#   (vuoto)             comando disabilitato per tutti
#
# I nomi non fanno distinzione tra maiuscole e minuscole e sopravvivono alla
# ricreazione dei ruoli, cosa che gli ID non fanno.
# Il proprietario del server puo' sempre usare tutto, anche i comandi disabilitati.
#
# ATTENZIONE: un comando SENZA la sua riga qui e' disabilitato per tutti.
# Se aggiorni il bot e compare un comando nuovo, aggiungilo anche qui.
#
# Gerarchia usata: Admin > Moderator > Helper > Scorer/Screensharer > giocatori.

